name: Deploy WordClockApi

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build and test
      run: |
        npm ci
        npm run build
        npm test
    - name: Copy files
      if: github.event_name == 'push'
      run: |
       cp --remove-destination ${{ github.workspace }}/dist/*.js /docker-config/klokapi/
       cp --remove-destination ${{ github.workspace }}/package.json ${{ github.workspace }}/package-lock.json /docker-config/klokapi/
    - name: Restart Service
      if: github.event_name == 'push'
      run: docker compose -f /docker-config/klokapi/compose.yml up -d --force-recreate
